services:
  postgres:
    image: postgres:16-alpine
    container_name: product-template-v2-postgres
    env_file:
      - path: compose.env
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose.env}
      POSTGRES_USER: postgres
      POSTGRES_DB: ProductTemplateV2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-template-v2-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: compose.env
        required: false
    environment:
      # Prefer Production so Development appsettings secrets are not loaded.
      # Override JWT/CORS/DB/seed via env vars (see compose.env.example).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ProductTemplateV2;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose.env}
      Database__UseInMemory: "false"
      Jwt__Enabled: "true"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in compose.env}
      Jwt__Issuer: ${JWT_ISSUER:-Product.Template}
      Jwt__Audience: ${JWT_AUDIENCE:-Product.Template.Api}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5080}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in compose.env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@producttemplate.com}
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
