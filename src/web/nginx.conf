server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA owns its routes; anything that is not a file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser sends no cross-origin request and CORS stays out of it.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
